<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>側臥室用電儀表板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23171a21'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%239b8cff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1115;--bg2:#12151b;--card:#171a21;--card2:#1c2029;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#e9ecf2;--sub:#a3abba;--faint:#6b7382;
  --plug:#3cc8b4;--heat:#f2a65a;--total:#9b8cff;--est:#c9a86a;--ok:#5fd0a0;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.55);
  --r:18px;--r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC","Segoe UI",Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#f5f6f8;--bg2:#eef0f3;--card:#ffffff;--card2:#f7f8fa;--line:rgba(15,20,30,.08);--line2:rgba(15,20,30,.14);
  --text:#161a22;--sub:#586173;--faint:#8a93a3;
  --plug:#12a594;--heat:#e0873a;--total:#6f5ff0;--est:#a58443;--ok:#2f9e6f;
  --shadow:0 1px 2px rgba(15,20,30,.04),0 8px 24px -12px rgba(15,20,30,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(800px 400px at 50% -120px,color-mix(in srgb,var(--total) 14%,transparent),transparent 70%);z-index:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
@media(min-width:720px){.wrap{padding:32px 28px 56px}}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;color:var(--sub);display:flex;align-items:center;gap:8px}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--total);box-shadow:0 0 0 4px color-mix(in srgb,var(--total) 20%,transparent)}
.iconbtn{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--sub);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--text)}
.iconbtn svg{width:18px;height:18px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{margin-top:14px}
@media(min-width:720px){.sec{margin-top:18px}}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec-h h2{font-size:17px;font-weight:650;letter-spacing:.01em}
.sec-h .hint{font-size:12.5px;color:var(--faint)}
/* hero */
.hero{padding:22px 20px 20px;overflow:hidden;position:relative}
@media(min-width:720px){.hero{padding:30px 32px 26px}}
.hero h1{font-size:14px;font-weight:500;color:var(--sub);margin-bottom:6px}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .big small{font-size:18px;font-weight:600;color:var(--sub);margin-right:4px;letter-spacing:0}
@media(min-width:720px){.hero .big{font-size:56px}}
.hero .kwh{margin-top:6px;font-size:15px;color:var(--sub)}
.hero .kwh b{color:var(--text);font-weight:650}
.compo{margin-top:18px}
.compo .bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--bg2);gap:2px}
.compo .bar span{display:block;height:100%}
.compo .keys{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--sub)}
.key{display:inline-flex;align-items:center;gap:7px}
.key i{width:9px;height:9px;border-radius:3px;display:inline-block}
.key b{color:var(--text);font-weight:600}
.meta{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 14px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.kpi{padding:14px 14px 13px}
@media(min-width:720px){.kpi{padding:18px}}
.kpi .l{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:7px}
.kpi .l i{width:7px;height:7px;border-radius:50%}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.01em;line-height:1.2}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .s{font-size:12px;color:var(--faint);margin-top:4px;line-height:1.45}
.kpi select{margin-top:6px;width:100%;appearance:none;border:1px solid var(--line2);background:var(--card2);color:var(--sub);font:inherit;font-size:12px;border-radius:9px;padding:4px 24px 4px 8px;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
/* scope switch */
.scopebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 2px 0}
.scopebar .t{font-size:13px;color:var(--sub)}
.pill{display:inline-flex;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line2);position:relative}
.pill button{appearance:none;border:0;background:transparent;color:var(--sub);font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .2s}
.pill button.on{color:var(--text);background:var(--card2);box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 1px var(--line2) inset}
/* tabs */
.chartcard{padding:14px 12px 10px}
@media(min-width:720px){.chartcard{padding:20px 20px 14px}}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg2);border-radius:14px;border:1px solid var(--line)}
.tabs button{flex:1;appearance:none;border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;padding:8px 0;border-radius:10px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2),0 0 0 1px var(--line2) inset}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 4px 2px;min-height:28px}
.chart-head .ttl{font-size:14px;font-weight:600}
.chart-head .sub{font-size:12px;color:var(--faint)}
.subpill{display:inline-flex;gap:2px;padding:2px;border-radius:9px;border:1px solid var(--line2)}
.subpill button{appearance:none;border:0;background:transparent;color:var(--faint);font:inherit;font-size:12px;padding:3px 9px;border-radius:7px;cursor:pointer}
.subpill button.on{background:var(--card2);color:var(--text)}
#chart{width:100%;height:300px}
@media(min-width:720px){#chart{height:360px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin:4px 4px 2px}
.legend .key i{width:8px;height:8px}
.legend .est i{background:var(--faint);opacity:.55}
.chart-note{font-size:11.5px;color:var(--faint);margin:6px 4px 2px;line-height:1.5}
/* stats */
.stats{display:grid;gap:10px}
@media(min-width:720px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.stat{padding:16px}
.stat .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.stat .h i{width:9px;height:9px;border-radius:3px}
.stat .h .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400}
.stat .m{margin-top:10px;font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat .m small{font-size:13px;color:var(--sub);font-weight:500;margin-left:4px}
.stat .cmp{font-size:12px;color:var(--faint);margin-top:2px}
.stat dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.stat dt{color:var(--sub)}
.stat dd{text-align:right;color:var(--text)}
.stat dd .d{color:var(--faint);font-size:11.5px;margin-left:6px}
@media(max-width:719px){
.stats{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stats::-webkit-scrollbar{display:none}
.stats .stat{flex:0 0 86%;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--line2);transition:all .2s}
.dots i.on{width:18px;background:var(--sub)}
}
@media(min-width:720px){.dots{display:none}}
.stat dl.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.stat dl.grid>div{min-width:0}
.stat dl.grid dt{font-size:11.5px;color:var(--faint)}
.stat dl.grid dd{text-align:left;font-size:15px;font-weight:600;margin-top:1px}
.stat dl.grid dd .d{display:block;margin:1px 0 0;font-size:11px;font-weight:400;line-height:1.35;white-space:normal}
.foot{font-size:11.5px;color:var(--faint);margin:10px 4px 0;line-height:1.7}
.foot b{color:var(--sub);font-weight:600}
/* insights */
.ins{display:grid;gap:10px}
@media(min-width:720px){.ins{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
.insight{padding:15px 16px;display:flex;gap:13px;align-items:flex-start}
.insight .ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.insight .ic svg{width:18px;height:18px}
.insight h3{font-size:14px;font-weight:650;margin-bottom:3px}
.insight p{font-size:13px;color:var(--sub);line-height:1.6}
.insight p b{color:var(--text);font-weight:600}
/* records */
.rec-tools{display:flex;gap:8px;align-items:center}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--text);font:inherit;font-size:13px;padding:7px 12px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--sub)}
.btn svg{width:15px;height:15px}
.list{padding:4px 0}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 16px;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.item .d{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.item .d .wd{color:var(--faint);font-weight:400;font-size:12.5px}
.item .r{text-align:right;font-weight:650;font-size:15px}
.item .r small{color:var(--faint);font-weight:400;font-size:12px;margin-left:2px}
.item .bd{grid-column:1/-1;display:flex;gap:12px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.item .bd span{display:inline-flex;align-items:center;gap:5px}
.item .bd i{width:6px;height:6px;border-radius:50%}
.item .x{padding:0 16px 13px;font-size:12.5px;color:var(--faint);line-height:1.6}
.item[open] summary{padding-bottom:8px}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid;letter-spacing:.02em}
.tag.est{color:var(--est);border-color:color-mix(in srgb,var(--est) 45%,transparent);background:color-mix(in srgb,var(--est) 10%,transparent)}
.tag.ap{color:var(--plug);border-color:color-mix(in srgb,var(--plug) 45%,transparent);background:color-mix(in srgb,var(--plug) 10%,transparent)}
.tag.nr{color:var(--faint);border-color:var(--line2)}
.more{display:block;width:100%;appearance:none;border:0;border-top:1px solid var(--line);background:transparent;color:var(--total);font:inherit;font-size:13.5px;padding:12px;cursor:pointer;border-radius:0 0 var(--r) var(--r)}
.tbl{display:none;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th:hover{color:var(--text)}
th .a{color:var(--faint);font-size:10px;margin-left:3px}
td.l,th.l{text-align:left}
td.note{color:var(--faint);font-size:12px;text-align:left;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr.isest td:not(.note){color:color-mix(in srgb,var(--text) 62%,transparent)}
tbody tr:hover td{background:var(--card2)}
tfoot td{font-weight:650;border-bottom:0;color:var(--text)}
@media(min-width:760px){.list{display:none}.tbl{display:block}.more{border-top:1px solid var(--line)}}
footer{margin:28px 4px 0;font-size:12px;color:var(--faint);text-align:center;line-height:1.8}
/* v3 additions: month switcher, badges, projection */
.top-r{display:flex;align-items:center;gap:8px}
.mpill{display:inline-flex;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line2)}
.mpill button{appearance:none;border:0;background:transparent;color:var(--sub);font:inherit;font-size:13.5px;font-weight:600;padding:5px 13px;border-radius:9px;cursor:pointer;transition:color .2s,background .2s}
.mpill button.on{color:var(--text);background:var(--card2);box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 1px var(--line2) inset}
.mpill button .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
@media(max-width:400px){.eyebrow .yr{display:none}}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.hero-top h1{margin-bottom:0}
.badge{flex:none;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid;letter-spacing:.04em;white-space:nowrap}
.badge.final{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.badge.live{color:var(--total);border-color:color-mix(in srgb,var(--total) 40%,transparent);background:color-mix(in srgb,var(--total) 10%,transparent)}
.proj{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.proj .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.proj .l{font-size:12.5px;color:var(--sub)}
.proj .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.proj .v small{font-size:12.5px;color:var(--sub);font-weight:500;margin-left:6px}
.proj .prog{height:6px;border-radius:999px;background:var(--bg2);overflow:hidden;margin:10px 0 6px}
.proj .prog span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--total) 60%,transparent),var(--total))}
.proj .s{font-size:11.5px;color:var(--faint);line-height:1.5}
.kpi .tagline{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:999px;padding:1px 8px}
.tabs button:disabled{opacity:.38;cursor:not-allowed}
.notice{padding:18px 18px 16px}
.notice h3{font-size:14.5px;font-weight:650;margin-bottom:4px}
.notice p{font-size:13px;color:var(--sub);line-height:1.65}
.notice .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.notice .mini dt{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
.notice .mini dt i{width:7px;height:7px;border-radius:50%}
.notice .mini dd{font-size:17px;font-weight:650;margin-top:2px}
.notice .mini dd small{font-size:11.5px;color:var(--faint);font-weight:400;margin-left:2px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><span class="dot"></span>側臥室用電<span class="yr">紀錄・2026</span></div>
    <div class="top-r">
      <div class="mpill" id="monthPill" role="tablist" aria-label="選擇月份"></div>
      <button class="iconbtn" id="themeBtn" aria-label="切換深色／淺色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>

  <section class="card hero">
    <div class="hero-top"><h1 id="heroTitle"></h1><span class="badge" id="heroBadge"></span></div>
    <div class="big num"><small>NT$</small><span id="heroFee"></span></div>
    <div class="kwh num" id="heroKwh"></div>
    <div class="proj num" id="heroProj"></div>
    <div class="compo">
      <div class="bar" id="compoBar"></div>
      <div class="keys" id="compoKeys"></div>
    </div>
    <div class="meta num" id="heroMeta"></div>
  </section>

  <section class="kpis sec" id="kpis"></section>

  <div class="scopebar" id="scopeBar">
    <span class="t">統計範圍</span>
    <div class="pill" id="scopePill"><button data-s="all" class="on">全部天數</button><button data-s="actual">僅實測日</button></div>
  </div>

  <section class="card chartcard sec">
    <div class="tabs" id="tabs"><button data-t="daily" class="on">每日</button><button data-t="cum">累計</button><button data-t="dist">分布</button><button data-t="week">星期</button></div>
    <div class="chart-head"><div><div class="ttl" id="chTitle"></div><div class="sub" id="chSub"></div></div><div id="chCtl"></div></div>
    <div id="chart"></div>
    <div class="legend" id="chLegend"></div>
    <div class="chart-note" id="chNote"></div>
  </section>

  <div class="sec-h"><h2>統計參數</h2><span class="hint" id="statHint"></span></div>
  <section class="stats" id="stats"></section>
  <div class="dots" id="statDots"><i class="on"></i><i></i><i></i></div>
  <p class="foot" id="statFoot"></p>

  <div class="sec-h"><h2>重點觀察</h2><span class="hint">依資料自動產生</span></div>
  <section class="ins" id="insights"></section>

  <div class="sec-h"><h2>每日明細</h2>
    <div class="rec-tools"><button class="btn" id="dlCsv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>CSV</button></div>
  </div>
  <section class="card">
    <div class="list" id="recList"></div>
    <div class="tbl"><table id="recTbl"></table></div>
    <button class="more" id="moreBtn"></button>
  </section>
  <p class="foot" id="recFoot"></p>

  <footer id="footer">資料來源：電表照片・冰箱＋風扇智慧插座 App<br>更新於 2026-10-07（台北時間）・網頁版・ECharts 5.6.0</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script>window.echarts||document.write('<script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"><\/script>')</script>

    dots.classList.add('hidden');
    const c=(k,v)=>`<div><dt><i style="background:var(${SERIES[k].v})"></i>${SERIES[k].short}</dt><dd class="num">${f2(v)}<small>度／日</small></dd></div>`;
    el.innerHTML=`<div class="card notice" style="flex:1 0 100%;grid-column:1/-1"><h3>資料累積中</h3><p>${M.label}目前僅 ${DAYS} 天資料，標準差、百分位數等統計參數將在累積 3 天以上後顯示；可切換至「${MONTHS.filter(m=>m.finalized).slice(-1).map(m=>m.label)[0]||'上月'}」查看完整統計。</p>
      <dl class="mini">${c('room',ST.room.all.mean)}${c('plug',ST.plug.all.mean)}${c('residual',ST.residual.all.mean)}</dl></div>`;
    return;}
  dots.classList.remove('hidden');
  const oth=SCOPE==='all'?'actual':'all',othName=SCOPE==='all'?'僅實測日':'全部天數';
  document.getElementById('statHint').textContent=(SCOPE==='all'?`全部 ${DAYS} 天`:'僅實測日')+(MOBILE()?'・左右滑動':'');
  el.innerHTML=Object.keys(SERIES).map(k=>{const s=ST[k][SCOPE],o=ST[k][oth];
    const row=(t,v,d)=>`<div><dt>${t}</dt><dd class="num">${v}${d?`<span class="d">${d}</span>`:''}</dd></div>`;
    return `<div class="card stat"><div class="h"><i style="background:var(${SERIES[k].v})"></i>${SERIES[k].short}<span class="n num">n = ${s.n}</span></div>
      <div class="m num">${f2(s.mean)}<small>± ${g2(s.sd)} 度／日</small></div>
      ${HAS_EST&&o?`<div class="cmp num">${othName}：${f2(o.mean)} ± ${g2(o.sd)}（n=${o.n}）</div>`:''}
      <dl class="grid">${row('中位數',f2(s.median))}${row('樣本標準差',g3(s.sd))}${row('變異係數',isNaN(s.cv)?'—':f1(s.cv)+'%')}
      ${row('最小值',f2(s.min),datesTxt(s.minDates))}${row('最大值',f2(s.max),datesTxt(s.maxDates))}${row('四分位距',f2(s.p75-s.p25))}
      ${row('P25',f2(s.p25))}${row('P75',f2(s.p75))}${row('母體標準差',f3(s.sdPop))}</dl>
      <div class="cmp num" style="margin-top:10px">逐日加總 ${f2(s.sum)} 度</div></div>`;}).join('');
  el.scrollLeft=0;document.querySelectorAll('#statDots i').forEach((d,i)=>d.classList.toggle('on',i===0));
}
(()=>{const el=document.getElementById('stats');el.addEventListener('scroll',()=>{const cards=[...el.children];if(cards.length<2)return;const c=el.scrollLeft+el.clientWidth/2;let best=0,bd=1e9;cards.forEach((k,i)=>{const m=k.offsetLeft+k.offsetWidth/2,d=Math.abs(m-c);if(d<bd){bd=d;best=i;}});document.querySelectorAll('#statDots i').forEach((d,i)=>d.classList.toggle('on',i===best));},{passive:true});})();
document.querySelectorAll('#scopePill button').forEach(b=>b.onclick=()=>{SCOPE=b.dataset.s;document.querySelectorAll('#scopePill button').forEach(x=>x.classList.toggle('on',x===b));renderStats();renderChart();});

/* ── insights ── */
const ICON={bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',flame:'<path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',up:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',check:'<path d="M20 6 9 17l-5-5"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',scale:'<path d="M12 3v18M5 7h14M7 7l-3 7a3 3 0 0 0 6 0zM17 7l-3 7a3 3 0 0 0 6 0z"/>'};
function insightsFor(){
  const act=ST.room.actual,ra=ST.residual.actual;
  if(M.key==='2026-09'){
    const low=R.filter(r=>r.date>='2026-09-23'&&r.date<='2026-09-28'),lowSum=low.reduce((a,r)=>a+r.room,0),lowPlug=low.reduce((a,r)=>a+r.plug,0)/low.length,d29=R.find(r=>r.date==='2026-09-29'),d30=R.find(r=>r.date==='2026-09-30');
    return [
     ['check','--ok','9 月結算 NT$'+f1(TOTAL*RATE),`${DAYS} 天共 <b>${f1(TOTAL)} 度</b>、日均 ${f2(MEAN)} 度（約 NT$${f1(MEAN*RATE)}）。實測日為 ${f2(act.mean)} ± ${f2(act.sd)} 度；房間無冷氣。`],
     ['flame','--heat','熱水器是主要來源',`熱水器＋小電占 <b>${f1(RES_AUTH/TOTAL*100)}%</b>（${f2(RES_AUTH)} 度・NT$${f1(RES_AUTH*RATE)}）。實測日每天 ${f2(ra.mean)} ± ${f2(ra.sd)} 度，變異係數僅 ${f1(ra.cv)}%，用量穩定。`],
     ['moon','--plug','9/23–9/28 低用電週',`6 天僅 <b>${f1(lowSum)} 度</b>（均分每日 0.70，約實測日均的 ${f1(0.70/act.mean*100)}%）；冰箱＋風扇也降至平均 ${f2(lowPlug)} 度。`],
     ['up','--total','月底回到常態',`9/29 約 ${f2(d29.room)} 度、9/30 <b>${f2(d30.room)} 度</b>（冰箱＋風扇 ${f2(d30.plug)}、熱水器＋小電 ${f2(d30.residual)}），回到實測日均附近。9/30 起點讀於 9/30 01:16，與 9/29 重疊約 1 小時。`],
    ];}
  const last=R[R.length-1],o=EST?EST.opts[assumeSel]:null,prevM=MONTHS[MONTHS.indexOf(M)-1],pST=prevM?STATS_ALL[prevM.key]:null;
  const items=[
   ['bolt','--total',DAYS===1?`${M.label}開局：${last.md}`:`${M.label}至今 ${DAYS} 天`,DAYS===1?`${last.md} 用電 <b>${f2(last.room)} 度</b>（NT$${f1(last.fee)}）：冰箱＋風扇 ${f2(last.plug)}、熱水器＋小電 ${f2(last.residual)} 度。`:`共 <b>${f1(TOTAL)} 度</b>（NT$${f1(TOTAL*RATE)}），日均 ${f2(MEAN)} 度；冰箱＋風扇 ${f2(M.plugApp)}、熱水器＋小電 ${f2(RES_AUTH)} 度。最近一天 ${last.md} 為 ${f2(last.room)} 度（NT$${f1(last.fee)}）。`],
  ];
  if(o)items.push(['target','--total',`全月預估 NT$${f1(o.fee)}`,`${assumeSel==='mtd'?`＝本月至今日均 <b>${f2(o.v)} 度</b> × ${M.daysInMonth} 天 ≈ ${f1(o.kwh)} 度（假設後續每天維持目前日均）。參考：最近 7 個實測日平均 ${f2(EST.opts.recent7.v)} 度 → NT$${f1(EST.opts.recent7.fee)}。`:`＝至今 ${f1(TOTAL)} 度 ＋ ${o.t} <b>${f2(o.v)} 度</b> × 剩餘 ${EST.rem} 天 ≈ ${f1(o.kwh)} 度。`}${DAYS<7&&assumeSel==='recent7'?`本月僅 ${DAYS} 天資料，基準採最近 7 個電表實測日（${o.d.join('、')}），排除均分估算日與約略值。`:''}可在上方切換基準。`]);
  if(prevM){const pm=prevM.totalKwh/prevM.records.length,pa=pST.room.actual.mean,pr=(prevM.totalKwh-prevM.plugApp)/prevM.totalKwh*100;
    items.push(['scale','--heat',`與 ${prevM.label}相比`,`${M.label}日均 <b>${f2(MEAN)} 度</b>，${MEAN>=pa?'高於':'略低於'} ${prevM.label}實測日均 ${f2(pa)}（${MEAN>=pa?'+':''}${f1((MEAN/pa-1)*100)}%）、${MEAN>=pm?'高於':'低於'} ${prevM.label}全月日均 ${f2(pm)}。熱水器＋小電占 ${f1(RES_AUTH/TOTAL*100)}%，與 ${prevM.label}（${f1(pr)}%）相近。`]);}
  return items;
}
function renderInsights(){
  document.getElementById('insights').innerHTML=insightsFor().map(([ic,v,h,p])=>`<div class="card insight"><div class="ic" style="background:color-mix(in srgb,var(${v}) 14%,transparent);color:var(${v})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[ic]}</svg></div><div><h3>${h}</h3><p class="num">${p}</p></div></div>`).join('');
}

/* ── records ── */
let showAll=false,sortK='date',sortDir=-1;
const tagFor=r=>(r.roomStatus==='estimated'?'<span class="tag est">估算</span>':r.roomStatus==='approx'?'<span class="tag ap">約略</span>':'')+(r.plugStatus!=='exact'?' <span class="tag nr">插頭未記錄</span>':'');
function renderRecords(){
  const lim=MOBILE()?7:10,desc=[...R].reverse(),list=showAll?desc:desc.slice(0,7);
  document.getElementById('recList').innerHTML=list.map(r=>`<details class="item"><summary><div class="d">${r.md}<span class="wd">週${WD[r.wd]}</span>${tagFor(r)}</div><div class="r num">${f2(r.room)}<small>度</small></div>
    <div class="bd num"><span><i style="background:var(--plug)"></i>${f2(r.plug)}</span><span><i style="background:var(--heat)"></i>${f2(r.residual)}</span><span>NT$${f1(r.fee)}</span><span style="margin-left:auto;color:var(--faint)">累計 NT$${f1(r.cumFee)}</span></div></summary>
    <div class="x num">電表：${r.reading==null?'未拍':f1(r.reading)}・${statusText(r)}${r.note?'<br>'+r.note:''}</div></details>`).join('');
  const mb=document.getElementById('moreBtn');mb.classList.toggle('hidden',R.length<=lim);mb.textContent=showAll?'收合':`顯示全部 ${R.length} 天`;mb.onclick=()=>{showAll=!showAll;renderRecords();};
  const COLS=[{k:'date',t:'日期',l:1,f:r=>`${r.md} <span style="color:var(--faint)">週${WD[r.wd]}</span>`},{k:'reading',t:'電表',f:r=>r.reading==null?'—':f1(r.reading),s:r=>r.reading??-1},
    {k:'room',t:'總用電',f:r=>f2(r.room)},{k:'plug',t:'冰箱＋風扇',f:r=>f2(r.plug)},{k:'residual',t:'熱水器＋小電',f:r=>f2(r.residual)},{k:'fee',t:'電費',f:r=>f1(r.fee)},{k:'cumFee',t:'累計',f:r=>f1(r.cumFee)},
    {k:'roomStatus',t:'狀態',l:1,f:r=>tagFor(r)||'<span style="color:var(--faint);font-size:12px">實測</span>'},{k:'note',t:'備註',l:1,f:r=>`<span title="${(r.note||'').replace(/"/g,'&quot;')}">${r.note||''}</span>`,c:'note'}];
  const col=COLS.find(c=>c.k===sortK),key=col.s||(r=>r[sortK]);
  const rows0=[...R].sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*sortDir;}),rows=showAll?rows0:rows0.slice(0,lim);
  document.getElementById('recTbl').innerHTML=`<thead><tr>${COLS.map(c=>`<th class="${c.l?'l':''}" data-k="${c.k}">${c.t}<span class="a">${c.k===sortK?(sortDir>0?'▲':'▼'):''}</span></th>`).join('')}</tr></thead><tbody class="num">${rows.map(r=>`<tr class="${r.est?'isest':''}">${COLS.map(c=>`<td class="${c.l?'l':''} ${c.c||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>
   <tfoot class="num"><tr><td class="l">${M.finalized?'結算':'至今'}</td><td>${f1(M.baseline)}→${f1(M.end)}</td><td>${f1(TOTAL)}</td><td>${f2(M.plugApp)}</td><td>${f2(RES_AUTH)}</td><td>${f1(TOTAL*RATE)}</td><td>${f1(TOTAL*RATE)}</td><td></td><td class="note">插頭以 ${M.plugNote} 為準</td></tr></tfoot>`;
  document.querySelectorAll('#recTbl th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortK)sortDir=-sortDir;else{sortK=k;sortDir=k==='date'?-1:1;}renderRecords();});
  document.getElementById('recFoot').textContent=M.recFoot;
}
document.getElementById('dlCsv').onclick=()=>{
  const head=['日期','星期','電表讀數_kWh','房間_kWh','插頭_kWh','殘差_kWh','殘差原始_kWh','當日電費_TWD','當月累積電費_TWD','當月累積插頭電費_TWD','當月累積殘差電費_TWD','房間資料狀態','插頭資料狀態','備註'];
  const esc=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[head.join(',')].concat(R.map(r=>[r.date,WD[r.wd],r.reading??'',r.room,r.plug,r.residual,r.residualRaw,r.fee,r.cumFee,r.plugCumFee,r.resCumFee,statusText(r),r.plugStatus==='exact'?'App精確':'未記錄',r.note].map(esc).join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${M.key}_側臥室用電明細.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
};
function renderAll(){renderHero();renderKpis();renderStats();renderInsights();renderRecords();renderChart();}
const h0=(location.hash||'').slice(1);
setMonth(MONTHS.some(m=>m.key===h0)?h0:DATA.current);
renderAll();
window.__READY=true;
</script>
